  <script type="__bundler/template">
"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"f3fbc4e1-c912-4d55-837d-f90ff40add7a\"><\u002Fscript>\n\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet data-dc-atomics=\"\">\n<style>/* ============================================================\n   SoftServe Ascend OS — Webfonts\n   Azurio (display), Replica LL TT (text), Roboto Mono (data)\n   ============================================================ */\n\n@font-face {\n  font-family: \"Azurio\";\n  src: url(\"fb6f884b-d9a1-4c26-ae5a-12c3fc566040\") format(\"opentype\");\n  font-weight: 400;\n  font-style: normal;\n  font-display: swap;\n}\n@font-face {\n  font-family: \"Azurio\";\n  src: url(\"e2fdc7b5-ed07-47fb-b604-8a35776b13fd\") format(\"opentype\");\n  font-weight: 600;\n  font-style: normal;\n  font-display: swap;\n}\n\n@font-face {\n  font-family: \"Replica LL TT\";\n  src: url(\"13cdcf49-d76c-4ea2-8f4b-62bd3b14efc2\") format(\"truetype\");\n  font-weight: 400;\n  font-style: normal;\n  font-display: swap;\n}\n@font-face {\n  font-family: \"Replica LL TT\";\n  src: url(\"3483f8f6-4208-456c-9011-61282a12e102\") format(\"truetype\");\n  font-weight: 700;\n  font-style: normal;\n  font-display: swap;\n}\n\n@font-face {\n  font-family: \"Roboto Mono SS\";\n  src: url(\"0a58aa75-5da9-427f-ae71-0576caa50c02\") format(\"truetype\");\n  font-weight: 300;\n  font-style: normal;\n  font-display: swap;\n}\n@font-face {\n  font-family: \"Roboto Mono SS\";\n  src: url(\"4bb82618-2ae8-42f6-8d0b-1e2fee8f77ec\") format(\"truetype\");\n  font-weight: 400;\n  font-style: normal;\n  font-display: swap;\n}\n@font-face {\n  font-family: \"Roboto Mono SS\";\n  src: url(\"cda67070-bbb2-49d8-b660-d02474355e2e\") format(\"truetype\");\n  font-weight: 700;\n  font-style: normal;\n  font-display: swap;\n}\n<\u002Fstyle>\n<style>/* ============================================================\n   SoftServe Ascend OS — Color\n   Base ramps + semantic aliases. Black is the system anchor;\n   Lviv Blue and Austin Orange are the two brand primaries.\n   ============================================================ */\n\n:root {\n  /* ---- Black & White ---- */\n  --ss-black: #000000;\n  --ss-white: #ffffff;\n\n  /* ---- Neutral (no hue) — pairs with any brand color ---- */\n  --ss-neutral-600: #26292b; /* near-black surface anchor   */\n  --ss-neutral-500: #4c5156;\n  --ss-neutral-400: #717a81;\n  --ss-neutral-300: #97a2ac;\n  --ss-neutral-200: #bdcbd7;\n  --ss-neutral-100: #d1dae2;\n  --ss-neutral-50:  #e1e7eb;\n  --ss-neutral-25:  #edf0f2;\n  --ss-neutral-10:  #f7f9fa;\n\n  /* ---- Lviv Blue (primary / cool) ---- */\n  --ss-blue-150: #0a4a6f; /* pressed — web-team button pressed state */\n  --ss-blue-125: #0e5e8b; /* hover — web-team button hover state */\n  --ss-blue-100: #1485c3; /* deepest — Pantone 2173 C (matches 2026 Corporate Template theme) */\n  --ss-blue-75:  #459fdd; /* core brand blue — Pantone 2190 C */\n  --ss-blue-50:  #c1dff3;\n  --ss-blue-tint: #f4f9fd; /* soft tint for fade-to-tint gradients */\n\n  /* ---- Austin Orange (primary / warm) ---- */\n  --ss-orange-150: #a53d26; /* pressed — web-team button pressed state */\n  --ss-orange-125: #c94e31; /* hover — web-team button hover state */\n  --ss-orange-100: #f36949; /* deepest — Pantone 2026 C (matches 2026 Corporate Template theme) */\n  --ss-orange-75:  #fe8d6b; /* core brand orange — Pantone 2023 C */\n  --ss-orange-50:  #ffcec0;\n  --ss-orange-tint: #fff7f5; /* soft tint */\n\n  /* ---- Semantic (states) ---- */\n  --ss-info:    var(--ss-blue-75);\n  --ss-success: #20e077;\n  --ss-success-light: #90f0bb;\n  --ss-success-deep: #0a7a44; /* accessible on white — for message text */\n  --ss-warning: #f0a429;\n  --ss-error:   #f95050;\n  --ss-error-light: #fca8a8;\n  --ss-error-deep: #d11f1f; /* accessible on white — for message text */\n\n  /* ============ SEMANTIC ALIASES ============ */\n  /* surfaces */\n  --surface-page:      var(--ss-white);\n  --surface-subtle:    var(--ss-neutral-10);\n  --surface-muted:     var(--ss-neutral-25);\n  --surface-card:      var(--ss-white);\n  --surface-inverse:   var(--ss-neutral-600);  /* dark sections */\n  --surface-black:     var(--ss-black);\n\n  /* text */\n  --text-primary:      var(--ss-neutral-600);\n  --text-secondary:    var(--ss-neutral-500);\n  --text-tertiary:     var(--ss-neutral-400);\n  --text-on-dark:      var(--ss-white);\n  --text-on-dark-dim:  var(--ss-neutral-300);\n  --text-accent:       var(--ss-blue-100);\n  --text-error:        var(--ss-error-deep);\n  --text-success:      var(--ss-success-deep);\n\n  /* lines & borders */\n  --border-subtle:     var(--ss-neutral-50);\n  --border-default:    var(--ss-neutral-200);\n  --border-strong:     var(--ss-neutral-400);\n  --border-on-dark:    rgba(255, 255, 255, 0.16);\n\n  /* interactive — primary action is black; blue is the link/accent */\n  --action-primary:        var(--ss-black);\n  --action-primary-hover:  var(--ss-neutral-600);\n  --accent:                var(--ss-blue-75);\n  --accent-hover:          var(--ss-blue-100);\n  --accent-warm:           var(--ss-orange-75);\n  --accent-warm-hover:     var(--ss-orange-100);\n  --focus-ring:            var(--ss-blue-75);\n\n  /* gradients — the two approved brand gradient families */\n  --gradient-blue:        linear-gradient(90deg, var(--ss-blue-75) 0%, var(--ss-blue-50) 51%, var(--ss-white) 100%);\n  --gradient-blue-tint:   linear-gradient(90deg, var(--ss-blue-75) 0%, var(--ss-blue-50) 50%, var(--ss-blue-tint) 100%);\n  --gradient-orange:      linear-gradient(90deg, var(--ss-orange-75) 0%, var(--ss-orange-50) 51%, var(--ss-white) 100%);\n  --gradient-orange-tint: linear-gradient(90deg, var(--ss-orange-75) 0%, var(--ss-orange-50) 50%, var(--ss-orange-tint) 100%);\n  /* elevated imagery backdrops (Tier-1 hero gradients) */\n  --gradient-hero-warm:   linear-gradient(180deg, var(--ss-orange-75) 0%, var(--ss-orange-50) 55%, var(--ss-white) 100%);\n  --gradient-hero-cool:   linear-gradient(180deg, var(--ss-blue-75) 0%, var(--ss-blue-50) 55%, var(--ss-white) 100%);\n\n  /* ---- Silver — engineered metallic gradient meshes (built from neutrals) ---- */\n  /* Light silver: #717a81 · #97a2ac · #bdcbd7 · #d1dae2 · #edf0f2 · #ffffff */\n  --gradient-silver-light:\n    radial-gradient(60% 70% at 68% 62%, #ffffff 0%, rgba(255,255,255,0) 48%),\n    radial-gradient(70% 80% at 8% 22%, #97a2ac 0%, rgba(151,162,172,0) 55%),\n    radial-gradient(60% 70% at 98% 8%, #edf0f2 0%, rgba(237,240,242,0) 45%),\n    radial-gradient(70% 80% at 18% 96%, #97a2ac 0%, rgba(151,162,172,0) 50%),\n    linear-gradient(120deg, #717a81 0%, #bdcbd7 48%, #d1dae2 100%); /* @kind color */\n  /* Dark silver: #000000 · #26292b · #4c5156 · #97a2ac */\n  --gradient-silver-dark:\n    radial-gradient(55% 65% at 88% 78%, #97a2ac 0%, rgba(151,162,172,0) 46%),\n    radial-gradient(70% 80% at 60% 56%, #4c5156 0%, rgba(76,81,86,0) 55%),\n    radial-gradient(60% 70% at 18% 92%, #26292b 0%, rgba(38,41,43,0) 55%),\n    linear-gradient(120deg, #000000 0%, #26292b 55%, #4c5156 100%); /* @kind color */\n}\n<\u002Fstyle>\n<style>/* ============================================================\n   SoftServe Ascend OS — Typography\n   Primary  : Azurio        — brand expression (Title Case)\n   Secondary: Replica LL TT — functional clarity (ALL CAPS heads / sentence body)\n   Tertiary : Roboto Mono   — data, labels, code (ALL CAPS labels)\n   System   : Roboto        — functional fallback only\n   ============================================================ */\n\n:root {\n  /* ---- families ---- */\n  --font-display: \"Azurio\", \"Times New Roman\", Georgia, serif;\n  --font-text: \"Replica LL TT\", \"Helvetica Neue\", Arial, sans-serif;\n  --font-mono: \"Roboto Mono SS\", ui-monospace, \"SF Mono\", Menlo, Consolas, monospace;\n  --font-system: \"Roboto\", -apple-system, BlinkMacSystemFont, \"Segoe UI\", Arial, sans-serif;\n\n  /* ---- weights ---- */\n  --fw-light: 300; /* @kind font */\n  --fw-regular: 400; /* @kind font */\n  --fw-semibold: 600; /* @kind font */\n  --fw-bold: 700; /* @kind font */\n\n  /* ---- type scale (px) ---- */\n  --fs-display-xl: 80px;\n  --fs-display-l:  64px;\n  --fs-display-m:  48px;\n  --fs-title:      32px;\n  --fs-subtitle:   24px;\n  --fs-body-lg:    20px;\n  --fs-body:       16px;\n  --fs-caption:    14px;\n  --fs-label:      12px;\n\n  /* ---- line heights ---- */\n  --lh-tight: 0.9; /* @kind other */\n  --lh-display: 1.1; /* @kind other */\n  --lh-snug: 1.2; /* @kind other */\n  --lh-body: 1.5; /* @kind other */\n\n  /* ---- tracking ---- */\n  --ls-display: 0.01em; /* @kind other */\n  --ls-tight: -0.015em; /* @kind other */\n  --ls-label: 0.04em; /* @kind other */\n  --ls-mono: 0.02em; /* @kind other */\n}\n\n/* ============ TEXT-STYLE UTILITY CLASSES ============ */\n/* Azurio — longer, editorial headlines. Title Case only. */\n.ss-display-xl {\n  font-family: var(--font-display);\n  font-weight: var(--fw-regular);\n  font-size: var(--fs-display-xl);\n  line-height: var(--lh-display);\n  letter-spacing: var(--ls-display);\n  color: var(--text-primary);\n}\n.ss-display {\n  font-family: var(--font-display);\n  font-weight: var(--fw-regular);\n  font-size: var(--fs-display-l);\n  line-height: var(--lh-display);\n  letter-spacing: var(--ls-display);\n  color: var(--text-primary);\n}\n.ss-display-sm {\n  font-family: var(--font-display);\n  font-weight: var(--fw-regular);\n  font-size: var(--fs-display-m);\n  line-height: 1.15;\n  letter-spacing: var(--ls-display);\n  color: var(--text-primary);\n}\n\n/* Replica — short, punchy headlines. ALL CAPS. */\n.ss-headline {\n  font-family: var(--font-text);\n  font-weight: var(--fw-regular);\n  font-size: var(--fs-display-xl);\n  line-height: var(--lh-tight);\n  letter-spacing: var(--ls-display);\n  text-transform: uppercase;\n  color: var(--text-primary);\n}\n.ss-supporting-title {\n  font-family: var(--font-text);\n  font-weight: var(--fw-regular);\n  font-size: var(--fs-display-m);\n  line-height: 0.95;\n  letter-spacing: var(--ls-tight);\n  color: var(--text-primary);\n}\n.ss-subheader {\n  font-family: var(--font-text);\n  font-weight: var(--fw-bold);\n  font-size: var(--fs-title);\n  line-height: 1.18;\n  text-transform: uppercase;\n  letter-spacing: 0.01em;\n  color: var(--text-primary);\n}\n\n/* body */\n.ss-body-lg {\n  font-family: var(--font-text);\n  font-weight: var(--fw-regular);\n  font-size: var(--fs-subtitle);\n  line-height: 1.3;\n  color: var(--text-secondary);\n}\n.ss-body {\n  font-family: var(--font-text);\n  font-weight: var(--fw-regular);\n  font-size: var(--fs-body);\n  line-height: var(--lh-body);\n  color: var(--text-secondary);\n}\n\n/* Roboto Mono — data, captions, labels. ALL CAPS for labels. */\n.ss-data-header {\n  font-family: var(--font-mono);\n  font-weight: var(--fw-bold);\n  font-size: var(--fs-body);\n  line-height: 1.1;\n  letter-spacing: var(--ls-mono);\n  text-transform: uppercase;\n  color: var(--text-secondary);\n}\n.ss-label {\n  font-family: var(--font-mono);\n  font-weight: var(--fw-regular);\n  font-size: var(--fs-label);\n  line-height: 1.2;\n  letter-spacing: var(--ls-label);\n  text-transform: uppercase;\n  color: var(--text-tertiary);\n}\n.ss-mono {\n  font-family: var(--font-mono);\n  font-weight: var(--fw-regular);\n  font-size: var(--fs-caption);\n  line-height: 1.4;\n  letter-spacing: var(--ls-mono);\n  color: var(--text-secondary);\n}\n<\u002Fstyle>\n<style>/* ============================================================\n   SoftServe Ascend OS — Spacing, geometry & effects\n   The signature geometry rule: chamfered (45°) cut corners,\n   defined by a linear offset (4 / 8 / 10px) on BOTH axes.\n   ============================================================ */\n\n:root {\n  /* ---- spacing scale (8px base grid) ---- */\n  --space-1: 4px;\n  --space-2: 8px;\n  --space-3: 12px;\n  --space-4: 16px;\n  --space-5: 24px;\n  --space-6: 32px;\n  --space-7: 48px;\n  --space-8: 64px;\n  --space-9: 96px;\n  --space-10: 128px;\n\n  /* ---- layout ---- */\n  --page-margin: 96px;       /* desktop page gutter used across the .fig */\n  --content-max: 1344px;\n  --header-height: 80px;\n\n  /* ---- chamfer offsets (the cut, measured along X = Y) ---- */\n  --chamfer-sm: 4px;\n  --chamfer-md: 8px;\n  --chamfer-lg: 10px;\n\n  /* chamfer clip-paths (all four corners cut at 45°) */\n  --clip-chamfer-sm: polygon(4px 0, calc(100% - 4px) 0, 100% 4px, 100% calc(100% - 4px), calc(100% - 4px) 100%, 4px 100%, 0 calc(100% - 4px), 0 4px); /* @kind other */\n  --clip-chamfer-md: polygon(8px 0, calc(100% - 8px) 0, 100% 8px, 100% calc(100% - 8px), calc(100% - 8px) 100%, 8px 100%, 0 calc(100% - 8px), 0 8px); /* @kind other */\n  --clip-chamfer-lg: polygon(10px 0, calc(100% - 10px) 0, 100% 10px, 100% calc(100% - 10px), calc(100% - 10px) 100%, 10px 100%, 0 calc(100% - 10px), 0 10px); /* @kind other */\n\n  /* chamfer BORDER rings — a hollow chamfered frame (outer chamfer + inner chamfer,\n     evenodd) for any bordered chamfered element. Apply to an inset::before so the\n     border traces the cut corners. A box-shadow/inset-border CANNOT follow a chamfer.\n     Each contour is explicitly closed back to its start so the donut seam is a\n     retraced zero-width segment at the top-left — NOT a slash across an edge. */\n  --clip-chamfer-ring-sm: polygon(evenodd, 4px 0, calc(100% - 4px) 0, 100% 4px, 100% calc(100% - 4px), calc(100% - 4px) 100%, 4px 100%, 0 calc(100% - 4px), 0 4px, 4px 0, 4.5px 1.5px, calc(100% - 4.5px) 1.5px, calc(100% - 1.5px) 4.5px, calc(100% - 1.5px) calc(100% - 4.5px), calc(100% - 4.5px) calc(100% - 1.5px), 4.5px calc(100% - 1.5px), 1.5px calc(100% - 4.5px), 1.5px 4.5px, 4.5px 1.5px); /* @kind other */\n  --clip-chamfer-ring-sm-2: polygon(evenodd, 4px 0, calc(100% - 4px) 0, 100% 4px, 100% calc(100% - 4px), calc(100% - 4px) 100%, 4px 100%, 0 calc(100% - 4px), 0 4px, 4px 0, 5px 2px, calc(100% - 5px) 2px, calc(100% - 2px) 5px, calc(100% - 2px) calc(100% - 5px), calc(100% - 5px) calc(100% - 2px), 5px calc(100% - 2px), 2px calc(100% - 5px), 2px 5px, 5px 2px); /* @kind other */\n  --clip-chamfer-ring-md: polygon(evenodd, 8px 0, calc(100% - 8px) 0, 100% 8px, 100% calc(100% - 8px), calc(100% - 8px) 100%, 8px 100%, 0 calc(100% - 8px), 0 8px, 8px 0, 8.5px 1.5px, calc(100% - 8.5px) 1.5px, calc(100% - 1.5px) 8.5px, calc(100% - 1.5px) calc(100% - 8.5px), calc(100% - 8.5px) calc(100% - 1.5px), 8.5px calc(100% - 1.5px), 1.5px calc(100% - 8.5px), 1.5px 8.5px, 8.5px 1.5px); /* @kind other */\n  --clip-chamfer-ring-md-2: polygon(evenodd, 8px 0, calc(100% - 8px) 0, 100% 8px, 100% calc(100% - 8px), calc(100% - 8px) 100%, 8px 100%, 0 calc(100% - 8px), 0 8px, 8px 0, 9px 2px, calc(100% - 9px) 2px, calc(100% - 2px) 9px, calc(100% - 2px) calc(100% - 9px), calc(100% - 9px) calc(100% - 2px), 9px calc(100% - 2px), 2px calc(100% - 9px), 2px 9px, 9px 2px); /* @kind other */\n\n  /* ---- radii (used sparingly — system is chamfer-first, not rounded) ---- */\n  --radius-none: 0px;\n  --radius-pill: 999px;\n\n  /* ---- shadows — restrained, neutral-tinted, never colored ---- */\n  --shadow-sm: 0 1px 2px rgba(38, 41, 43, 0.06), 0 1px 1px rgba(38, 41, 43, 0.04);\n  --shadow-md: 0 4px 16px rgba(38, 41, 43, 0.08);\n  --shadow-lg: 0 12px 40px rgba(38, 41, 43, 0.12);\n  --shadow-focus: 0 0 0 3px rgba(69, 159, 221, 0.4);\n\n  /* ---- motion — precise, engineered easing; no bounce ---- */\n  --ease-standard: cubic-bezier(0.2, 0, 0, 1); /* @kind other */\n  --ease-out: cubic-bezier(0.16, 1, 0.3, 1); /* @kind other */\n  --dur-fast: 120ms; /* @kind other */\n  --dur-base: 220ms; /* @kind other */\n  --dur-slow: 400ms; /* @kind other */\n}\n<\u002Fstyle>\n<style>/* ============================================================\n   SoftServe Ascend OS — Base element defaults\n   ============================================================ */\n\n*,\n*::before,\n*::after {\n  box-sizing: border-box;\n}\n\nbody {\n  margin: 0;\n  font-family: var(--font-text);\n  font-size: var(--fs-body);\n  line-height: var(--lh-body);\n  color: var(--text-primary);\n  background: var(--surface-page);\n  -webkit-font-smoothing: antialiased;\n  text-rendering: optimizeLegibility;\n}\n\n::selection {\n  background: var(--ss-orange-50);\n  color: var(--ss-neutral-600);\n}\n\na {\n  color: var(--text-accent);\n  text-decoration: none;\n}\n\n/* Utility: apply a chamfered cut to any element */\n.ss-chamfer-sm { clip-path: var(--clip-chamfer-sm); }\n.ss-chamfer-md { clip-path: var(--clip-chamfer-md); }\n.ss-chamfer-lg { clip-path: var(--clip-chamfer-lg); }\n<\u002Fstyle>\n<style>/* ============================================================\n   SoftServe Ascend OS — Core component styles\n   Chamfer-first geometry. Loaded into the global closure so\n   consumers get hover/focus states for free.\n   ============================================================ */\n\n/* ---------------- Button ---------------- */\n.ss-btn {\n  position: relative;\n  display: inline-flex;\n  align-items: center;\n  justify-content: center;\n  gap: 10px;\n  border: none;\n  cursor: pointer;\n  font-family: var(--font-text);\n  font-weight: 700;\n  text-transform: uppercase;\n  letter-spacing: 0.04em;\n  white-space: nowrap;\n  clip-path: var(--clip-chamfer-sm);\n  transition: background var(--dur-base) var(--ease-standard),\n              color var(--dur-base) var(--ease-standard),\n              transform var(--dur-fast) var(--ease-standard);\n  user-select: none;\n}\n.ss-btn:active { transform: translateY(1px); }\n.ss-btn:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 3px; }\n.ss-btn > * { position: relative; z-index: 1; } /* keep label/icon above the border ring */\n.ss-btn__icon { display: inline-flex; width: 1em; height: 1em; }\n.ss-btn__icon svg { width: 100%; height: 100%; display: block; }\n\n/* sizes */\n.ss-btn--lg { height: 48px; padding: 0 24px; font-size: 14px; }\n.ss-btn--md { height: 40px; padding: 0 20px; font-size: 13px; }\n.ss-btn--sm { height: 32px; padding: 0 14px; font-size: 12px; }\n\n/* primary — solid black, the system action anchor */\n.ss-btn--primary {\n  background: var(--action-primary);\n  color: var(--text-on-dark);\n}\n.ss-btn--primary:hover { background: var(--action-primary-hover); }\n\n/* accent — solid blue. Web-team states: Default (Lviv Blue 100) → Hover → Pressed. Black label for WCAG contrast. */\n.ss-btn--accent { background: var(--ss-blue-100); color: var(--ss-black); }\n.ss-btn--accent:hover { background: var(--ss-blue-75); color: var(--ss-black); }\n.ss-btn--accent:active { background: var(--ss-blue-125); color: var(--ss-black); }\n\n/* warm — Austin Orange. Web-team states: Default (Austin Orange 100) → Hover → Pressed. Black label for WCAG contrast. */\n.ss-btn--warm { background: var(--ss-orange-100); color: var(--ss-black); }\n.ss-btn--warm:hover { background: var(--ss-orange-75); color: var(--ss-black); }\n.ss-btn--warm:active { background: var(--ss-orange-125); color: var(--ss-black); }\n\n/* secondary — light surface, neutral edge. The edge is a chamfered border RING\n   (drawn on ::before) so it follows the cut corners — an inset box-shadow can't. */\n.ss-btn--secondary {\n  background: var(--surface-card);\n  color: var(--text-primary);\n}\n.ss-btn--secondary::before {\n  content: \"\"; position: absolute; inset: 0; z-index: 0; pointer-events: none;\n  background: var(--border-default);\n  clip-path: var(--clip-chamfer-ring-sm);\n}\n.ss-btn--secondary:hover { color: var(--accent-hover); }\n.ss-btn--secondary:hover::before { background: var(--accent); }\n\n/* ghost — transparent */\n.ss-btn--ghost { background: transparent; color: var(--text-primary); }\n.ss-btn--ghost:hover { background: var(--surface-muted); }\n\n/* on dark surfaces — transparent fill, light chamfered border ring */\n.ss-btn--onDark.ss-btn--secondary { background: transparent; color: var(--text-on-dark); }\n.ss-btn--onDark.ss-btn--secondary::before { background: var(--border-on-dark); }\n.ss-btn--onDark.ss-btn--secondary:hover { color: var(--text-on-dark); }\n.ss-btn--onDark.ss-btn--secondary:hover::before { background: var(--ss-white); }\n\n.ss-btn:disabled, .ss-btn[aria-disabled=\"true\"] {\n  opacity: 0.4; cursor: not-allowed; pointer-events: none;\n}\n\n/* ---------------- Link (Discover →) ---------------- */\n.ss-link {\n  display: inline-flex; align-items: center; gap: 8px;\n  font-family: var(--font-text); font-weight: 700; font-size: 14px;\n  text-transform: uppercase; letter-spacing: 0.04em;\n  color: var(--text-primary); cursor: pointer; background: none; border: none; padding: 0;\n  transition: gap var(--dur-base) var(--ease-out), color var(--dur-base) var(--ease-standard);\n}\n.ss-link__icon { display: inline-flex; width: 18px; height: 18px; transition: transform var(--dur-base) var(--ease-out); }\n.ss-link__icon svg { width: 100%; height: 100%; }\n.ss-link:hover { color: var(--accent-hover); gap: 12px; }\n.ss-link--onDark { color: var(--text-on-dark); }\n.ss-link--onDark:hover { color: var(--ss-orange-75); }\n\n/* ---------------- Tag / Badge ---------------- */\n.ss-tag {\n  display: inline-flex; align-items: center; gap: 6px;\n  height: 24px; padding: 0 10px;\n  font-family: var(--font-mono); font-weight: 700; font-size: 11px;\n  text-transform: uppercase; letter-spacing: 0.06em;\n  white-space: nowrap;\n  background: var(--ss-neutral-600); color: var(--text-on-dark);\n}\n.ss-tag--blue { background: var(--accent); color: var(--ss-white); }\n.ss-tag--orange { background: var(--accent-warm); color: var(--ss-neutral-600); }\n.ss-tag--outline { background: transparent; color: var(--text-primary); box-shadow: inset 0 0 0 1px var(--border-default); }\n.ss-tag--success { background: var(--ss-success); color: #fff; }\n.ss-tag--warning { background: var(--ss-warning); color: var(--ss-neutral-600); }\n.ss-tag--error { background: var(--ss-error); color: #fff; }\n\n/* ---------------- Card ---------------- */\n.ss-card {\n  position: relative;\n  display: flex; flex-direction: column;\n  background: var(--surface-card);\n  clip-path: var(--clip-chamfer-lg);\n  box-shadow: var(--shadow-sm);\n  overflow: hidden;\n  transition: box-shadow var(--dur-base) var(--ease-standard), transform var(--dur-base) var(--ease-out);\n}\n.ss-card--interactive { cursor: pointer; }\n.ss-card--interactive:hover { box-shadow: var(--shadow-lg); transform: translateY(-3px); }\n.ss-card--inverse { background: var(--surface-inverse); color: var(--text-on-dark); }\n.ss-card__media { position: relative; aspect-ratio: 16 / 10; overflow: hidden; background: var(--ss-neutral-600); }\n.ss-card__media img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform var(--dur-slow) var(--ease-out); }\n.ss-card--interactive:hover .ss-card__media img { transform: scale(1.04); }\n.ss-card__body { padding: 24px; display: flex; flex-direction: column; gap: 12px; flex: 1; }\n.ss-card__title { font-family: var(--font-text); font-weight: 700; font-size: 22px; line-height: 1.15; text-transform: uppercase; letter-spacing: 0.005em; }\n.ss-card__desc { font-family: var(--font-text); font-size: 15px; line-height: 1.5; color: var(--text-secondary); }\n.ss-card__tagrow { position: absolute; top: 16px; left: 16px; display: flex; gap: 6px; z-index: 2; }\n\n/* ---------------- Input ---------------- */\n.ss-field { display: flex; flex-direction: column; gap: 8px; }\n.ss-field__label { font-family: var(--font-mono); font-weight: 700; font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-tertiary); }\n\n/* Border-ring shell: the chamfered border is drawn on ::before so it follows the\n   cut corners. Wraps the field; the field itself is borderless inside it. */\n.ss-input-shell { position: relative; display: block; clip-path: var(--clip-chamfer-sm); }\n.ss-input-shell::before {\n  content: \"\"; position: absolute; inset: 0; z-index: 2; pointer-events: none;\n  background: var(--border-default);\n  clip-path: var(--clip-chamfer-ring-sm);\n  transition: background var(--dur-base) var(--ease-standard), clip-path var(--dur-base) var(--ease-standard);\n}\n.ss-input-shell .ss-input,\n.ss-input-shell .ss-input:focus { box-shadow: none; clip-path: none; }\n.ss-input-shell:focus-within::before { background: var(--accent); clip-path: var(--clip-chamfer-ring-sm-2); }\n.ss-input-shell:has(.ss-input--error)::before { background: var(--ss-error); }\n.ss-input-shell:has(.ss-input--error):focus-within::before { clip-path: var(--clip-chamfer-ring-sm-2); }\n.ss-input-shell:has(.ss-input--success)::before { background: var(--ss-success); }\n.ss-input-shell:has(.ss-input--success):focus-within::before { clip-path: var(--clip-chamfer-ring-sm-2); }\n\n.ss-input {\n  height: 48px; padding: 0 16px;\n  font-family: var(--font-text); font-size: 16px; color: var(--text-primary);\n  background: var(--surface-card);\n  border: none; box-shadow: inset 0 0 0 1.5px var(--border-default);\n  clip-path: var(--clip-chamfer-sm);\n  transition: box-shadow var(--dur-base) var(--ease-standard);\n  width: 100%; box-sizing: border-box;\n}\n.ss-input::placeholder { color: var(--text-tertiary); }\n.ss-input:focus { outline: none; box-shadow: inset 0 0 0 2px var(--accent); }\n.ss-input:disabled { background: var(--surface-muted); opacity: 0.7; cursor: not-allowed; }\ntextarea.ss-input { height: auto; padding: 14px 16px; resize: vertical; line-height: 1.5; }\n\n/* validation states */\n.ss-input--error { box-shadow: inset 0 0 0 1.5px var(--ss-error); }\n.ss-input--error:focus { box-shadow: inset 0 0 0 2px var(--ss-error); }\n.ss-input--success { box-shadow: inset 0 0 0 1.5px var(--ss-success); }\n.ss-input--success:focus { box-shadow: inset 0 0 0 2px var(--ss-success); }\n\n/* required marker */\n.ss-field__req { margin-left: 4px; color: var(--accent-warm-hover); }\n\n/* helper text + validation message (mono, below the field) */\n.ss-field__hint {\n  font-family: var(--font-mono); font-weight: 400; font-size: 11px;\n  line-height: 1.4; letter-spacing: var(--ls-mono); color: var(--text-tertiary);\n}\n.ss-field__msg {\n  display: inline-flex; align-items: center; gap: 6px;\n  font-family: var(--font-mono); font-weight: 700; font-size: 11px;\n  line-height: 1.3; letter-spacing: var(--ls-label); text-transform: uppercase;\n}\n.ss-field__msg svg { width: 14px; height: 14px; flex: none; }\n.ss-field__msg--error { color: var(--text-error); }\n.ss-field__msg--success { color: var(--text-success); }\n\n/* on-dark field variant */\n.ss-field--onDark .ss-field__label { color: var(--text-on-dark-dim); }\n.ss-field--onDark .ss-input-shell::before { background: var(--border-on-dark); }\n.ss-field--onDark .ss-input-shell:focus-within::before { background: var(--accent); }\n.ss-field--onDark .ss-input-shell:has(.ss-input--error)::before { background: var(--ss-error); }\n.ss-field--onDark .ss-input-shell:has(.ss-input--success)::before { background: var(--ss-success); }\n.ss-field--onDark .ss-input {\n  background: rgba(255, 255, 255, 0.06); color: var(--text-on-dark);\n  box-shadow: inset 0 0 0 1.5px var(--border-on-dark);\n}\n.ss-field--onDark .ss-input::placeholder { color: var(--text-on-dark-dim); }\n.ss-field--onDark .ss-input:focus { box-shadow: inset 0 0 0 2px var(--accent); }\n.ss-field--onDark .ss-input--error { box-shadow: inset 0 0 0 1.5px var(--ss-error); }\n.ss-field--onDark .ss-input--success { box-shadow: inset 0 0 0 1.5px var(--ss-success); }\n/* Inside the shell the border IS the ::before ring — remove the input's own inset\n   border (these win over the bare-input dark box-shadows above by specificity). */\n.ss-field--onDark .ss-input-shell .ss-input,\n.ss-field--onDark .ss-input-shell .ss-input:focus,\n.ss-field--onDark .ss-input-shell .ss-input--error,\n.ss-field--onDark .ss-input-shell .ss-input--success { box-shadow: none; }\n.ss-field--onDark .ss-field__hint { color: var(--text-on-dark-dim); }\n.ss-field--onDark .ss-field__msg--error { color: var(--ss-error-light); }\n.ss-field--onDark .ss-field__msg--success { color: var(--ss-success-light); }\n\n/* ---------------- Icon button (50px nav square) ---------------- */\n.ss-iconbtn {\n  display: inline-flex; align-items: center; justify-content: center;\n  width: 50px; height: 50px; border: none; cursor: pointer;\n  background: var(--ss-neutral-600); color: var(--text-on-dark);\n  clip-path: var(--clip-chamfer-sm);\n  transition: background var(--dur-base) var(--ease-standard);\n}\n.ss-iconbtn svg { width: 22px; height: 22px; }\n.ss-iconbtn:hover { background: var(--ss-black); }\n.ss-iconbtn--light { background: var(--surface-muted); color: var(--text-primary); }\n.ss-iconbtn--light:hover { background: var(--ss-neutral-100); }\n.ss-iconbtn--accent { background: var(--accent); color: #fff; }\n.ss-iconbtn--accent:hover { background: var(--accent-hover); }\n.ss-iconbtn:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 2px; }\n\n/* ---------------- Stat / data block ---------------- */\n.ss-stat { display: flex; flex-direction: column; gap: 6px; }\n.ss-stat__value { font-family: var(--font-mono); font-weight: 300; font-size: 48px; line-height: 1; letter-spacing: -0.01em; color: var(--text-primary); }\n.ss-stat__label { font-family: var(--font-mono); font-weight: 400; font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-tertiary); }\n.ss-stat--onDark .ss-stat__value { color: var(--text-on-dark); }\n.ss-stat--accent .ss-stat__value { color: var(--accent); }\n<\u002Fstyle>\n<style>/* ============================================================\n   SoftServe — Ascend OS Design System\n   Global entry point. Consumers link THIS file only.\n   (Import list only — no rules live here.)\n   rev: chamfered border rings (buttons/inputs/tags)\n   ============================================================ */\n\n/* ============================================================\n   SoftServe Ascend OS — Webfonts\n   Azurio (display), Replica LL TT (text), Roboto Mono (data)\n   ============================================================ */\n\n@font-face {\n  font-family: \"Azurio\";\n  src: url(\"fb6f884b-d9a1-4c26-ae5a-12c3fc566040\") format(\"opentype\");\n  font-weight: 400;\n  font-style: normal;\n  font-display: swap;\n}\n@font-face {\n  font-family: \"Azurio\";\n  src: url(\"e2fdc7b5-ed07-47fb-b604-8a35776b13fd\") format(\"opentype\");\n  font-weight: 600;\n  font-style: normal;\n  font-display: swap;\n}\n\n@font-face {\n  font-family: \"Replica LL TT\";\n  src: url(\"13cdcf49-d76c-4ea2-8f4b-62bd3b14efc2\") format(\"truetype\");\n  font-weight: 400;\n  font-style: normal;\n  font-display: swap;\n}\n@font-face {\n  font-family: \"Replica LL TT\";\n  src: url(\"3483f8f6-4208-456c-9011-61282a12e102\") format(\"truetype\");\n  font-weight: 700;\n  font-style: normal;\n  font-display: swap;\n}\n\n@font-face {\n  font-family: \"Roboto Mono SS\";\n  src: url(\"0a58aa75-5da9-427f-ae71-0576caa50c02\") format(\"truetype\");\n  font-weight: 300;\n  font-style: normal;\n  font-display: swap;\n}\n@font-face {\n  font-family: \"Roboto Mono SS\";\n  src: url(\"4bb82618-2ae8-42f6-8d0b-1e2fee8f77ec\") format(\"truetype\");\n  font-weight: 400;\n  font-style: normal;\n  font-display: swap;\n}\n@font-face {\n  font-family: \"Roboto Mono SS\";\n  src: url(\"cda67070-bbb2-49d8-b660-d02474355e2e\") format(\"truetype\");\n  font-weight: 700;\n  font-style: normal;\n  font-display: swap;\n}\n\n/* ============================================================\n   SoftServe Ascend OS — Color\n   Base ramps + semantic aliases. Black is the system anchor;\n   Lviv Blue and Austin Orange are the two brand primaries.\n   ============================================================ */\n\n:root {\n  /* ---- Black & White ---- */\n  --ss-black: #000000;\n  --ss-white: #ffffff;\n\n  /* ---- Neutral (no hue) — pairs with any brand color ---- */\n  --ss-neutral-600: #26292b; /* near-black surface anchor   */\n  --ss-neutral-500: #4c5156;\n  --ss-neutral-400: #717a81;\n  --ss-neutral-300: #97a2ac;\n  --ss-neutral-200: #bdcbd7;\n  --ss-neutral-100: #d1dae2;\n  --ss-neutral-50:  #e1e7eb;\n  --ss-neutral-25:  #edf0f2;\n  --ss-neutral-10:  #f7f9fa;\n\n  /* ---- Lviv Blue (primary / cool) ---- */\n  --ss-blue-150: #0a4a6f; /* pressed — web-team button pressed state */\n  --ss-blue-125: #0e5e8b; /* hover — web-team button hover state */\n  --ss-blue-100: #1485c3; /* deepest — Pantone 2173 C (matches 2026 Corporate Template theme) */\n  --ss-blue-75:  #459fdd; /* core brand blue — Pantone 2190 C */\n  --ss-blue-50:  #c1dff3;\n  --ss-blue-tint: #f4f9fd; /* soft tint for fade-to-tint gradients */\n\n  /* ---- Austin Orange (primary / warm) ---- */\n  --ss-orange-150: #a53d26; /* pressed — web-team button pressed state */\n  --ss-orange-125: #c94e31; /* hover — web-team button hover state */\n  --ss-orange-100: #f36949; /* deepest — Pantone 2026 C (matches 2026 Corporate Template theme) */\n  --ss-orange-75:  #fe8d6b; /* core brand orange — Pantone 2023 C */\n  --ss-orange-50:  #ffcec0;\n  --ss-orange-tint: #fff7f5; /* soft tint */\n\n  /* ---- Semantic (states) ---- */\n  --ss-info:    var(--ss-blue-75);\n  --ss-success: #20e077;\n  --ss-success-light: #90f0bb;\n  --ss-success-deep: #0a7a44; /* accessible on white — for message text */\n  --ss-warning: #f0a429;\n  --ss-error:   #f95050;\n  --ss-error-light: #fca8a8;\n  --ss-error-deep: #d11f1f; /* accessible on white — for message text */\n\n  /* ============ SEMANTIC ALIASES ============ */\n  /* surfaces */\n  --surface-page:      var(--ss-white);\n  --surface-subtle:    var(--ss-neutral-10);\n  --surface-muted:     var(--ss-neutral-25);\n  --surface-card:      var(--ss-white);\n  --surface-inverse:   var(--ss-neutral-600);  /* dark sections */\n  --surface-black:     var(--ss-black);\n\n  /* text */\n  --text-primary:      var(--ss-neutral-600);\n  --text-secondary:    var(--ss-neutral-500);\n  --text-tertiary:     var(--ss-neutral-400);\n  --text-on-dark:      var(--ss-white);\n  --text-on-dark-dim:  var(--ss-neutral-300);\n  --text-accent:       var(--ss-blue-100);\n  --text-error:        var(--ss-error-deep);\n  --text-success:      var(--ss-success-deep);\n\n  /* lines & borders */\n  --border-subtle:     var(--ss-neutral-50);\n  --border-default:    var(--ss-neutral-200);\n  --border-strong:     var(--ss-neutral-400);\n  --border-on-dark:    rgba(255, 255, 255, 0.16);\n\n  /* interactive — primary action is black; blue is the link/accent */\n  --action-primary:        var(--ss-black);\n  --action-primary-hover:  var(--ss-neutral-600);\n  --accent:                var(--ss-blue-75);\n  --accent-hover:          var(--ss-blue-100);\n  --accent-warm:           var(--ss-orange-75);\n  --accent-warm-hover:     var(--ss-orange-100);\n  --focus-ring:            var(--ss-blue-75);\n\n  /* gradients — the two approved brand gradient families */\n  --gradient-blue:        linear-gradient(90deg, var(--ss-blue-75) 0%, var(--ss-blue-50) 51%, var(--ss-white) 100%);\n  --gradient-blue-tint:   linear-gradient(90deg, var(--ss-blue-75) 0%, var(--ss-blue-50) 50%, var(--ss-blue-tint) 100%);\n  --gradient-orange:      linear-gradient(90deg, var(--ss-orange-75) 0%, var(--ss-orange-50) 51%, var(--ss-white) 100%);\n  --gradient-orange-tint: linear-gradient(90deg, var(--ss-orange-75) 0%, var(--ss-orange-50) 50%, var(--ss-orange-tint) 100%);\n  /* elevated imagery backdrops (Tier-1 hero gradients) */\n  --gradient-hero-warm:   linear-gradient(180deg, var(--ss-orange-75) 0%, var(--ss-orange-50) 55%, var(--ss-white) 100%);\n  --gradient-hero-cool:   linear-gradient(180deg, var(--ss-blue-75) 0%, var(--ss-blue-50) 55%, var(--ss-white) 100%);\n\n  /* ---- Silver — engineered metallic gradient meshes (built from neutrals) ---- */\n  /* Light silver: #717a81 · #97a2ac · #bdcbd7 · #d1dae2 · #edf0f2 · #ffffff */\n  --gradient-silver-light:\n    radial-gradient(60% 70% at 68% 62%, #ffffff 0%, rgba(255,255,255,0) 48%),\n    radial-gradient(70% 80% at 8% 22%, #97a2ac 0%, rgba(151,162,172,0) 55%),\n    radial-gradient(60% 70% at 98% 8%, #edf0f2 0%, rgba(237,240,242,0) 45%),\n    radial-gradient(70% 80% at 18% 96%, #97a2ac 0%, rgba(151,162,172,0) 50%),\n    linear-gradient(120deg, #717a81 0%, #bdcbd7 48%, #d1dae2 100%); /* @kind color */\n  /* Dark silver: #000000 · #26292b · #4c5156 · #97a2ac */\n  --gradient-silver-dark:\n    radial-gradient(55% 65% at 88% 78%, #97a2ac 0%, rgba(151,162,172,0) 46%),\n    radial-gradient(70% 80% at 60% 56%, #4c5156 0%, rgba(76,81,86,0) 55%),\n    radial-gradient(60% 70% at 18% 92%, #26292b 0%, rgba(38,41,43,0) 55%),\n    linear-gradient(120deg, #000000 0%, #26292b 55%, #4c5156 100%); /* @kind color */\n}\n\n/* ============================================================\n   SoftServe Ascend OS — Typography\n   Primary  : Azurio        — brand expression (Title Case)\n   Secondary: Replica LL TT — functional clarity (ALL CAPS heads / sentence body)\n   Tertiary : Roboto Mono   — data, labels, code (ALL CAPS labels)\n   System   : Roboto        — functional fallback only\n   ============================================================ */\n\n:root {\n  /* ---- families ---- */\n  --font-display: \"Azurio\", \"Times New Roman\", Georgia, serif;\n  --font-text: \"Replica LL TT\", \"Helvetica Neue\", Arial, sans-serif;\n  --font-mono: \"Roboto Mono SS\", ui-monospace, \"SF Mono\", Menlo, Consolas, monospace;\n  --font-system: \"Roboto\", -apple-system, BlinkMacSystemFont, \"Segoe UI\", Arial, sans-serif;\n\n  /* ---- weights ---- */\n  --fw-light: 300; /* @kind font */\n  --fw-regular: 400; /* @kind font */\n  --fw-semibold: 600; /* @kind font */\n  --fw-bold: 700; /* @kind font */\n\n  /* ---- type scale (px) ---- */\n  --fs-display-xl: 80px;\n  --fs-display-l:  64px;\n  --fs-display-m:  48px;\n  --fs-title:      32px;\n  --fs-subtitle:   24px;\n  --fs-body-lg:    20px;\n  --fs-body:       16px;\n  --fs-caption:    14px;\n  --fs-label:      12px;\n\n  /* ---- line heights ---- */\n  --lh-tight: 0.9; /* @kind other */\n  --lh-display: 1.1; /* @kind other */\n  --lh-snug: 1.2; /* @kind other */\n  --lh-body: 1.5; /* @kind other */\n\n  /* ---- tracking ---- */\n  --ls-display: 0.01em; /* @kind other */\n  --ls-tight: -0.015em; /* @kind other */\n  --ls-label: 0.04em; /* @kind other */\n  --ls-mono: 0.02em; /* @kind other */\n}\n\n/* ============ TEXT-STYLE UTILITY CLASSES ============ */\n/* Azurio — longer, editorial headlines. Title Case only. */\n.ss-display-xl {\n  font-family: var(--font-display);\n  font-weight: var(--fw-regular);\n  font-size: var(--fs-display-xl);\n  line-height: var(--lh-display);\n  letter-spacing: var(--ls-display);\n  color: var(--text-primary);\n}\n.ss-display {\n  font-family: var(--font-display);\n  font-weight: var(--fw-regular);\n  font-size: var(--fs-display-l);\n  line-height: var(--lh-display);\n  letter-spacing: var(--ls-display);\n  color: var(--text-primary);\n}\n.ss-display-sm {\n  font-family: var(--font-display);\n  font-weight: var(--fw-regular);\n  font-size: var(--fs-display-m);\n  line-height: 1.15;\n  letter-spacing: var(--ls-display);\n  color: var(--text-primary);\n}\n\n/* Replica — short, punchy headlines. ALL CAPS. */\n.ss-headline {\n  font-family: var(--font-text);\n  font-weight: var(--fw-regular);\n  font-size: var(--fs-display-xl);\n  line-height: var(--lh-tight);\n  letter-spacing: var(--ls-display);\n  text-transform: uppercase;\n  color: var(--text-primary);\n}\n.ss-supporting-title {\n  font-family: var(--font-text);\n  font-weight: var(--fw-regular);\n  font-size: var(--fs-display-m);\n  line-height: 0.95;\n  letter-spacing: var(--ls-tight);\n  color: var(--text-primary);\n}\n.ss-subheader {\n  font-family: var(--font-text);\n  font-weight: var(--fw-bold);\n  font-size: var(--fs-title);\n  line-height: 1.18;\n  text-transform: uppercase;\n  letter-spacing: 0.01em;\n  color: var(--text-primary);\n}\n\n/* body */\n.ss-body-lg {\n  font-family: var(--font-text);\n  font-weight: var(--fw-regular);\n  font-size: var(--fs-subtitle);\n  line-height: 1.3;\n  color: var(--text-secondary);\n}\n.ss-body {\n  font-family: var(--font-text);\n  font-weight: var(--fw-regular);\n  font-size: var(--fs-body);\n  line-height: var(--lh-body);\n  color: var(--text-secondary);\n}\n\n/* Roboto Mono — data, captions, labels. ALL CAPS for labels. */\n.ss-data-header {\n  font-family: var(--font-mono);\n  font-weight: var(--fw-bold);\n  font-size: var(--fs-body);\n  line-height: 1.1;\n  letter-spacing: var(--ls-mono);\n  text-transform: uppercase;\n  color: var(--text-secondary);\n}\n.ss-label {\n  font-family: var(--font-mono);\n  font-weight: var(--fw-regular);\n  font-size: var(--fs-label);\n  line-height: 1.2;\n  letter-spacing: var(--ls-label);\n  text-transform: uppercase;\n  color: var(--text-tertiary);\n}\n.ss-mono {\n  font-family: var(--font-mono);\n  font-weight: var(--fw-regular);\n  font-size: var(--fs-caption);\n  line-height: 1.4;\n  letter-spacing: var(--ls-mono);\n  color: var(--text-secondary);\n}\n\n/* ============================================================\n   SoftServe Ascend OS — Spacing, geometry & effects\n   The signature geometry rule: chamfered (45°) cut corners,\n   defined by a linear offset (4 / 8 / 10px) on BOTH axes.\n   ============================================================ */\n\n:root {\n  /* ---- spacing scale (8px base grid) ---- */\n  --space-1: 4px;\n  --space-2: 8px;\n  --space-3: 12px;\n  --space-4: 16px;\n  --space-5: 24px;\n  --space-6: 32px;\n  --space-7: 48px;\n  --space-8: 64px;\n  --space-9: 96px;\n  --space-10: 128px;\n\n  /* ---- layout ---- */\n  --page-margin: 96px;       /* desktop page gutter used across the .fig */\n  --content-max: 1344px;\n  --header-height: 80px;\n\n  /* ---- chamfer offsets (the cut, measured along X = Y) ---- */\n  --chamfer-sm: 4px;\n  --chamfer-md: 8px;\n  --chamfer-lg: 10px;\n\n  /* chamfer clip-paths (all four corners cut at 45°) */\n  --clip-chamfer-sm: polygon(4px 0, calc(100% - 4px) 0, 100% 4px, 100% calc(100% - 4px), calc(100% - 4px) 100%, 4px 100%, 0 calc(100% - 4px), 0 4px); /* @kind other */\n  --clip-chamfer-md: polygon(8px 0, calc(100% - 8px) 0, 100% 8px, 100% calc(100% - 8px), calc(100% - 8px) 100%, 8px 100%, 0 calc(100% - 8px), 0 8px); /* @kind other */\n  --clip-chamfer-lg: polygon(10px 0, calc(100% - 10px) 0, 100% 10px, 100% calc(100% - 10px), calc(100% - 10px) 100%, 10px 100%, 0 calc(100% - 10px), 0 10px); /* @kind other */\n\n  /* chamfer BORDER rings — a hollow chamfered frame (outer chamfer + inner chamfer,\n     evenodd) for any bordered chamfered element. Apply to an inset::before so the\n     border traces the cut corners. A box-shadow/inset-border CANNOT follow a chamfer.\n     Each contour is explicitly closed back to its start so the donut seam is a\n     retraced zero-width segment at the top-left — NOT a slash across an edge. */\n  --clip-chamfer-ring-sm: polygon(evenodd, 4px 0, calc(100% - 4px) 0, 100% 4px, 100% calc(100% - 4px), calc(100% - 4px) 100%, 4px 100%, 0 calc(100% - 4px), 0 4px, 4px 0, 4.5px 1.5px, calc(100% - 4.5px) 1.5px, calc(100% - 1.5px) 4.5px, calc(100% - 1.5px) calc(100% - 4.5px), calc(100% - 4.5px) calc(100% - 1.5px), 4.5px calc(100% - 1.5px), 1.5px calc(100% - 4.5px), 1.5px 4.5px, 4.5px 1.5px); /* @kind other */\n  --clip-chamfer-ring-sm-2: polygon(evenodd, 4px 0, calc(100% - 4px) 0, 100% 4px, 100% calc(100% - 4px), calc(100% - 4px) 100%, 4px 100%, 0 calc(100% - 4px), 0 4px, 4px 0, 5px 2px, calc(100% - 5px) 2px, calc(100% - 2px) 5px, calc(100% - 2px) calc(100% - 5px), calc(100% - 5px) calc(100% - 2px), 5px calc(100% - 2px), 2px calc(100% - 5px), 2px 5px, 5px 2px); /* @kind other */\n  --clip-chamfer-ring-md: polygon(evenodd, 8px 0, calc(100% - 8px) 0, 100% 8px, 100% calc(100% - 8px), calc(100% - 8px) 100%, 8px 100%, 0 calc(100% - 8px), 0 8px, 8px 0, 8.5px 1.5px, calc(100% - 8.5px) 1.5px, calc(100% - 1.5px) 8.5px, calc(100% - 1.5px) calc(100% - 8.5px), calc(100% - 8.5px) calc(100% - 1.5px), 8.5px calc(100% - 1.5px), 1.5px calc(100% - 8.5px), 1.5px 8.5px, 8.5px 1.5px); /* @kind other */\n  --clip-chamfer-ring-md-2: polygon(evenodd, 8px 0, calc(100% - 8px) 0, 100% 8px, 100% calc(100% - 8px), calc(100% - 8px) 100%, 8px 100%, 0 calc(100% - 8px), 0 8px, 8px 0, 9px 2px, calc(100% - 9px) 2px, calc(100% - 2px) 9px, calc(100% - 2px) calc(100% - 9px), calc(100% - 9px) calc(100% - 2px), 9px calc(100% - 2px), 2px calc(100% - 9px), 2px 9px, 9px 2px); /* @kind other */\n\n  /* ---- radii (used sparingly — system is chamfer-first, not rounded) ---- */\n  --radius-none: 0px;\n  --radius-pill: 999px;\n\n  /* ---- shadows — restrained, neutral-tinted, never colored ---- */\n  --shadow-sm: 0 1px 2px rgba(38, 41, 43, 0.06), 0 1px 1px rgba(38, 41, 43, 0.04);\n  --shadow-md: 0 4px 16px rgba(38, 41, 43, 0.08);\n  --shadow-lg: 0 12px 40px rgba(38, 41, 43, 0.12);\n  --shadow-focus: 0 0 0 3px rgba(69, 159, 221, 0.4);\n\n  /* ---- motion — precise, engineered easing; no bounce ---- */\n  --ease-standard: cubic-bezier(0.2, 0, 0, 1); /* @kind other */\n  --ease-out: cubic-bezier(0.16, 1, 0.3, 1); /* @kind other */\n  --dur-fast: 120ms; /* @kind other */\n  --dur-base: 220ms; /* @kind other */\n  --dur-slow: 400ms; /* @kind other */\n}\n\n/* ============================================================\n   SoftServe Ascend OS — Base element defaults\n   ============================================================ */\n\n*,\n*::before,\n*::after {\n  box-sizing: border-box;\n}\n\nbody {\n  margin: 0;\n  font-family: var(--font-text);\n  font-size: var(--fs-body);\n  line-height: var(--lh-body);\n  color: var(--text-primary);\n  background: var(--surface-page);\n  -webkit-font-smoothing: antialiased;\n  text-rendering: optimizeLegibility;\n}\n\n::selection {\n  background: var(--ss-orange-50);\n  color: var(--ss-neutral-600);\n}\n\na {\n  color: var(--text-accent);\n  text-decoration: none;\n}\n\n/* Utility: apply a chamfered cut to any element */\n.ss-chamfer-sm { clip-path: var(--clip-chamfer-sm); }\n.ss-chamfer-md { clip-path: var(--clip-chamfer-md); }\n.ss-chamfer-lg { clip-path: var(--clip-chamfer-lg); }\n\n/* ============================================================\n   SoftServe Ascend OS — Core component styles\n   Chamfer-first geometry. Loaded into the global closure so\n   consumers get hover/focus states for free.\n   ============================================================ */\n\n/* ---------------- Button ---------------- */\n.ss-btn {\n  position: relative;\n  display: inline-flex;\n  align-items: center;\n  justify-content: center;\n  gap: 10px;\n  border: none;\n  cursor: pointer;\n  font-family: var(--font-text);\n  font-weight: 700;\n  text-transform: uppercase;\n  letter-spacing: 0.04em;\n  white-space: nowrap;\n  clip-path: var(--clip-chamfer-sm);\n  transition: background var(--dur-base) var(--ease-standard),\n              color var(--dur-base) var(--ease-standard),\n              transform var(--dur-fast) var(--ease-standard);\n  user-select: none;\n}\n.ss-btn:active { transform: translateY(1px); }\n.ss-btn:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 3px; }\n.ss-btn > * { position: relative; z-index: 1; } /* keep label/icon above the border ring */\n.ss-btn__icon { display: inline-flex; width: 1em; height: 1em; }\n.ss-btn__icon svg { width: 100%; height: 100%; display: block; }\n\n/* sizes */\n.ss-btn--lg { height: 48px; padding: 0 24px; font-size: 14px; }\n.ss-btn--md { height: 40px; padding: 0 20px; font-size: 13px; }\n.ss-btn--sm { height: 32px; padding: 0 14px; font-size: 12px; }\n\n/* primary — solid black, the system action anchor */\n.ss-btn--primary {\n  background: var(--action-primary);\n  color: var(--text-on-dark);\n}\n.ss-btn--primary:hover { background: var(--action-primary-hover); }\n\n/* accent — solid blue. Web-team states: Default (Lviv Blue 100) → Hover → Pressed. Black label for WCAG contrast. */\n.ss-btn--accent { background: var(--ss-blue-100); color: var(--ss-black); }\n.ss-btn--accent:hover { background: var(--ss-blue-75); color: var(--ss-black); }\n.ss-btn--accent:active { background: var(--ss-blue-125); color: var(--ss-black); }\n\n/* warm — Austin Orange. Web-team states: Default (Austin Orange 100) → Hover → Pressed. Black label for WCAG contrast. */\n.ss-btn--warm { background: var(--ss-orange-100); color: var(--ss-black); }\n.ss-btn--warm:hover { background: var(--ss-orange-75); color: var(--ss-black); }\n.ss-btn--warm:active { background: var(--ss-orange-125); color: var(--ss-black); }\n\n/* secondary — light surface, neutral edge. The edge is a chamfered border RING\n   (drawn on ::before) so it follows the cut corners — an inset box-shadow can't. */\n.ss-btn--secondary {\n  background: var(--surface-card);\n  color: var(--text-primary);\n}\n.ss-btn--secondary::before {\n  content: \"\"; position: absolute; inset: 0; z-index: 0; pointer-events: none;\n  background: var(--border-default);\n  clip-path: var(--clip-chamfer-ring-sm);\n}\n.ss-btn--secondary:hover { color: var(--accent-hover); }\n.ss-btn--secondary:hover::before { background: var(--accent); }\n\n/* ghost — transparent */\n.ss-btn--ghost { background: transparent; color: var(--text-primary); }\n.ss-btn--ghost:hover { background: var(--surface-muted); }\n\n/* on dark surfaces — transparent fill, light chamfered border ring */\n.ss-btn--onDark.ss-btn--secondary { background: transparent; color: var(--text-on-dark); }\n.ss-btn--onDark.ss-btn--secondary::before { background: var(--border-on-dark); }\n.ss-btn--onDark.ss-btn--secondary:hover { color: var(--text-on-dark); }\n.ss-btn--onDark.ss-btn--secondary:hover::before { background: var(--ss-white); }\n\n.ss-btn:disabled, .ss-btn[aria-disabled=\"true\"] {\n  opacity: 0.4; cursor: not-allowed; pointer-events: none;\n}\n\n/* ---------------- Link (Discover →) ---------------- */\n.ss-link {\n  display: inline-flex; align-items: center; gap: 8px;\n  font-family: var(--font-text); font-weight: 700; font-size: 14px;\n  text-transform: uppercase; letter-spacing: 0.04em;\n  color: var(--text-primary); cursor: pointer; background: none; border: none; padding: 0;\n  transition: gap var(--dur-base) var(--ease-out), color var(--dur-base) var(--ease-standard);\n}\n.ss-link__icon { display: inline-flex; width: 18px; height: 18px; transition: transform var(--dur-base) var(--ease-out); }\n.ss-link__icon svg { width: 100%; height: 100%; }\n.ss-link:hover { color: var(--accent-hover); gap: 12px; }\n.ss-link--onDark { color: var(--text-on-dark); }\n.ss-link--onDark:hover { color: var(--ss-orange-75); }\n\n/* ---------------- Tag / Badge ---------------- */\n.ss-tag {\n  display: inline-flex; align-items: center; gap: 6px;\n  height: 24px; padding: 0 10px;\n  font-family: var(--font-mono); font-weight: 700; font-size: 11px;\n  text-transform: uppercase; letter-spacing: 0.06em;\n  white-space: nowrap;\n  background: var(--ss-neutral-600); color: var(--text-on-dark);\n}\n.ss-tag--blue { background: var(--accent); color: var(--ss-white); }\n.ss-tag--orange { background: var(--accent-warm); color: var(--ss-neutral-600); }\n.ss-tag--outline { background: transparent; color: var(--text-primary); box-shadow: inset 0 0 0 1px var(--border-default); }\n.ss-tag--success { background: var(--ss-success); color: #fff; }\n.ss-tag--warning { background: var(--ss-warning); color: var(--ss-neutral-600); }\n.ss-tag--error { background: var(--ss-error); color: #fff; }\n\n/* ---------------- Card ---------------- */\n.ss-card {\n  position: relative;\n  display: flex; flex-direction: column;\n  background: var(--surface-card);\n  clip-path: var(--clip-chamfer-lg);\n  box-shadow: var(--shadow-sm);\n  overflow: hidden;\n  transition: box-shadow var(--dur-base) var(--ease-standard), transform var(--dur-base) var(--ease-out);\n}\n.ss-card--interactive { cursor: pointer; }\n.ss-card--interactive:hover { box-shadow: var(--shadow-lg); transform: translateY(-3px); }\n.ss-card--inverse { background: var(--surface-inverse); color: var(--text-on-dark); }\n.ss-card__media { position: relative; aspect-ratio: 16 / 10; overflow: hidden; background: var(--ss-neutral-600); }\n.ss-card__media img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform var(--dur-slow) var(--ease-out); }\n.ss-card--interactive:hover .ss-card__media img { transform: scale(1.04); }\n.ss-card__body { padding: 24px; display: flex; flex-direction: column; gap: 12px; flex: 1; }\n.ss-card__title { font-family: var(--font-text); font-weight: 700; font-size: 22px; line-height: 1.15; text-transform: uppercase; letter-spacing: 0.005em; }\n.ss-card__desc { font-family: var(--font-text); font-size: 15px; line-height: 1.5; color: var(--text-secondary); }\n.ss-card__tagrow { position: absolute; top: 16px; left: 16px; display: flex; gap: 6px; z-index: 2; }\n\n/* ---------------- Input ---------------- */\n.ss-field { display: flex; flex-direction: column; gap: 8px; }\n.ss-field__label { font-family: var(--font-mono); font-weight: 700; font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-tertiary); }\n\n/* Border-ring shell: the chamfered border is drawn on ::before so it follows the\n   cut corners. Wraps the field; the field itself is borderless inside it. */\n.ss-input-shell { position: relative; display: block; clip-path: var(--clip-chamfer-sm); }\n.ss-input-shell::before {\n  content: \"\"; position: absolute; inset: 0; z-index: 2; pointer-events: none;\n  background: var(--border-default);\n  clip-path: var(--clip-chamfer-ring-sm);\n  transition: background var(--dur-base) var(--ease-standard), clip-path var(--dur-base) var(--ease-standard);\n}\n.ss-input-shell .ss-input,\n.ss-input-shell .ss-input:focus { box-shadow: none; clip-path: none; }\n.ss-input-shell:focus-within::before { background: var(--accent); clip-path: var(--clip-chamfer-ring-sm-2); }\n.ss-input-shell:has(.ss-input--error)::before { background: var(--ss-error); }\n.ss-input-shell:has(.ss-input--error):focus-within::before { clip-path: var(--clip-chamfer-ring-sm-2); }\n.ss-input-shell:has(.ss-input--success)::before { background: var(--ss-success); }\n.ss-input-shell:has(.ss-input--success):focus-within::before { clip-path: var(--clip-chamfer-ring-sm-2); }\n\n.ss-input {\n  height: 48px; padding: 0 16px;\n  font-family: var(--font-text); font-size: 16px; color: var(--text-primary);\n  background: var(--surface-card);\n  border: none; box-shadow: inset 0 0 0 1.5px var(--border-default);\n  clip-path: var(--clip-chamfer-sm);\n  transition: box-shadow var(--dur-base) var(--ease-standard);\n  width: 100%; box-sizing: border-box;\n}\n.ss-input::placeholder { color: var(--text-tertiary); }\n.ss-input:focus { outline: none; box-shadow: inset 0 0 0 2px var(--accent); }\n.ss-input:disabled { background: var(--surface-muted); opacity: 0.7; cursor: not-allowed; }\ntextarea.ss-input { height: auto; padding: 14px 16px; resize: vertical; line-height: 1.5; }\n\n/* validation states */\n.ss-input--error { box-shadow: inset 0 0 0 1.5px var(--ss-error); }\n.ss-input--error:focus { box-shadow: inset 0 0 0 2px var(--ss-error); }\n.ss-input--success { box-shadow: inset 0 0 0 1.5px var(--ss-success); }\n.ss-input--success:focus { box-shadow: inset 0 0 0 2px var(--ss-success); }\n\n/* required marker */\n.ss-field__req { margin-left: 4px; color: var(--accent-warm-hover); }\n\n/* helper text + validation message (mono, below the field) */\n.ss-field__hint {\n  font-family: var(--font-mono); font-weight: 400; font-size: 11px;\n  line-height: 1.4; letter-spacing: var(--ls-mono); color: var(--text-tertiary);\n}\n.ss-field__msg {\n  display: inline-flex; align-items: center; gap: 6px;\n  font-family: var(--font-mono); font-weight: 700; font-size: 11px;\n  line-height: 1.3; letter-spacing: var(--ls-label); text-transform: uppercase;\n}\n.ss-field__msg svg { width: 14px; height: 14px; flex: none; }\n.ss-field__msg--error { color: var(--text-error); }\n.ss-field__msg--success { color: var(--text-success); }\n\n/* on-dark field variant */\n.ss-field--onDark .ss-field__label { color: var(--text-on-dark-dim); }\n.ss-field--onDark .ss-input-shell::before { background: var(--border-on-dark); }\n.ss-field--onDark .ss-input-shell:focus-within::before { background: var(--accent); }\n.ss-field--onDark .ss-input-shell:has(.ss-input--error)::before { background: var(--ss-error); }\n.ss-field--onDark .ss-input-shell:has(.ss-input--success)::before { background: var(--ss-success); }\n.ss-field--onDark .ss-input {\n  background: rgba(255, 255, 255, 0.06); color: var(--text-on-dark);\n  box-shadow: inset 0 0 0 1.5px var(--border-on-dark);\n}\n.ss-field--onDark .ss-input::placeholder { color: var(--text-on-dark-dim); }\n.ss-field--onDark .ss-input:focus { box-shadow: inset 0 0 0 2px var(--accent); }\n.ss-field--onDark .ss-input--error { box-shadow: inset 0 0 0 1.5px var(--ss-error); }\n.ss-field--onDark .ss-input--success { box-shadow: inset 0 0 0 1.5px var(--ss-success); }\n/* Inside the shell the border IS the ::before ring — remove the input's own inset\n   border (these win over the bare-input dark box-shadows above by specificity). */\n.ss-field--onDark .ss-input-shell .ss-input,\n.ss-field--onDark .ss-input-shell .ss-input:focus,\n.ss-field--onDark .ss-input-shell .ss-input--error,\n.ss-field--onDark .ss-input-shell .ss-input--success { box-shadow: none; }\n.ss-field--onDark .ss-field__hint { color: var(--text-on-dark-dim); }\n.ss-field--onDark .ss-field__msg--error { color: var(--ss-error-light); }\n.ss-field--onDark .ss-field__msg--success { color: var(--ss-success-light); }\n\n/* ---------------- Icon button (50px nav square) ---------------- */\n.ss-iconbtn {\n  display: inline-flex; align-items: center; justify-content: center;\n  width: 50px; height: 50px; border: none; cursor: pointer;\n  background: var(--ss-neutral-600); color: var(--text-on-dark);\n  clip-path: var(--clip-chamfer-sm);\n  transition: background var(--dur-base) var(--ease-standard);\n}\n.ss-iconbtn svg { width: 22px; height: 22px; }\n.ss-iconbtn:hover { background: var(--ss-black); }\n.ss-iconbtn--light { background: var(--surface-muted); color: var(--text-primary); }\n.ss-iconbtn--light:hover { background: var(--ss-neutral-100); }\n.ss-iconbtn--accent { background: var(--accent); color: #fff; }\n.ss-iconbtn--accent:hover { background: var(--accent-hover); }\n.ss-iconbtn:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 2px; }\n\n/* ---------------- Stat / data block ---------------- */\n.ss-stat { display: flex; flex-direction: column; gap: 6px; }\n.ss-stat__value { font-family: var(--font-mono); font-weight: 300; font-size: 48px; line-height: 1; letter-spacing: -0.01em; color: var(--text-primary); }\n.ss-stat__label { font-family: var(--font-mono); font-weight: 400; font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-tertiary); }\n.ss-stat--onDark .ss-stat__value { color: var(--text-on-dark); }\n.ss-stat--accent .ss-stat__value { color: var(--accent); }\n\n<\u002Fstyle>\n<script src=\"fcd290f0-f989-4485-8df8-722d8513b87b\"><\u002Fscript>\n<style>\nbody{margin:0;background:#edf0f2;font-family:\"Replica LL TT\",\"Helvetica Neue\",Arial,sans-serif}\na{color:#1485c3;text-decoration:none}a:hover{color:#0e5e8b}\n<\u002Fstyle><\u002Fhelmet>\n\n<div style=\"max-width:1280px;margin:0 auto;padding:36px 40px 44px\">\n\n  <div style=\"display:flex;justify-content:space-between;align-items:flex-end;gap:32px;flex-wrap:wrap;margin-bottom:22px\">\n    <div style=\"flex:1 1 420px;min-width:0\">\n      <div style=\"font-family:'Roboto Mono SS',ui-monospace,Menlo,monospace;text-transform:uppercase;letter-spacing:.04em;font-size:11px;color:#4c5156;margin-bottom:8px\">Test coverage · Patent Workbench (PWB)<\u002Fdiv>\n      <h1 style=\"font-family:var(--font-display);font-weight:400;font-size:34px;line-height:1.1;margin:0;color:#26292b\">Coverage By Level, App By App.<\u002Fh1>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:7px;align-items:flex-end\">\n      <div style=\"display:flex;gap:3px;background:#fff;border:1px solid #d6dde2;padding:3px;border-radius:9px;box-shadow:0 1px 2px rgba(38,41,43,.06)\">\n        <button type=\"button\" sc-camel-on-click=\"{{ showMatrix }}\" style=\"border:0;cursor:pointer;font-family:'Replica LL TT',Arial,sans-serif;text-transform:uppercase;letter-spacing:.07em;font-size:11.5px;line-height:1;padding:12px 22px;min-width:152px;text-align:center;border-radius:6px;transition:background .22s cubic-bezier(.2,0,0,1),color .22s cubic-bezier(.2,0,0,1);background:{{ tabMatrixBg }};color:{{ tabMatrixFg }}\" style-hover=\"background:{{ tabMatrixHover }}\">Coverage matrix<\u002Fbutton>\n        <button type=\"button\" sc-camel-on-click=\"{{ showQueue }}\" style=\"border:0;cursor:pointer;font-family:'Replica LL TT',Arial,sans-serif;text-transform:uppercase;letter-spacing:.07em;font-size:11.5px;line-height:1;padding:12px 22px;min-width:152px;text-align:center;border-radius:6px;transition:background .22s cubic-bezier(.2,0,0,1),color .22s cubic-bezier(.2,0,0,1);background:{{ tabQueueBg }};color:{{ tabQueueFg }}\" style-hover=\"background:{{ tabQueueHover }}\">Test pyramid<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:flex;gap:26px;flex-wrap:wrap;align-items:center;padding:0 0 22px;border-bottom:1px solid #dfe5e9;margin-bottom:26px\">\n    <div style=\"font-family:'Roboto Mono SS',ui-monospace,Menlo,monospace;font-size:11px;color:#4c5156;text-transform:uppercase;letter-spacing:.04em\">Generated {{ generatedLocal }}<\u002Fdiv>\n    <div style=\"font-family:'Roboto Mono SS',ui-monospace,Menlo,monospace;font-size:11px;color:#97a2ac;text-transform:uppercase;letter-spacing:.04em\">{{ generatedUtc }}<\u002Fdiv>\n  <\u002Fdiv>\n\n  <sc-if value=\"{{ isMatrix }}\" hint-placeholder-val=\"{{ true }}\">\n  <div style=\"background:#fff;box-shadow:0 1px 3px rgba(38,41,43,.10),0 8px 24px rgba(38,41,43,.06);border-radius:12px;padding:30px 34px 26px\">\n    <div style=\"display:flex;justify-content:space-between;align-items:flex-end;gap:28px;flex-wrap:wrap;margin-bottom:22px\">\n      <div>\n        <div style=\"font-family: 'Roboto Mono SS',ui-monospace,Menlo,monospace; text-transform: uppercase; letter-spacing: .04em; font-size: 11px; color: #4c5156; margin-bottom: 6px; width: 318px; height: 16px\">Coverage matrix · every figure is coverage %<\u002Fdiv>\n        <h2 style=\"font-family:var(--font-text);font-weight:400;text-transform:uppercase;letter-spacing:.02em;font-size:24px;line-height:.9;margin:0 0 10px;color:#26292b\">Every Level, Every App<\u002Fh2>\n        <p style=\"font-size:13px;line-height:1.3;color:#4c5156;margin:0;max-width:62ch\">Each app has one row and each test level one column. The number is the share of code or cases covered. The rule under it runs from 0 to 100%, and the small notch marks the target for that level. Orange means the level is below its target.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"max-height:462px;overflow-y:auto;overflow-x:hidden;scrollbar-width:thin;scrollbar-color:#bdcbd7 #f2f5f7;padding-right:10px\">\n      <div style=\"position:sticky;top:0;z-index:2;background:#fff;display:grid;grid-template-columns:216px repeat(6,minmax(64px,1fr));gap:0 18px;padding-bottom:8px;border-bottom:2px solid #26292b\">\n        <div style=\"font-family:'Roboto Mono SS',ui-monospace,Menlo,monospace;text-transform:uppercase;font-size:10px;color:#4c5156;align-self:end;padding-bottom:2px\">App<\u002Fdiv>\n        <sc-for list=\"{{ levels }}\" as=\"lv\" hint-placeholder-count=\"6\">\n          <div style=\"align-self:end\">\n            <div style=\"font-family:'Roboto Mono SS',ui-monospace,Menlo,monospace;text-transform:uppercase;font-size:10.5px;color:#26292b;line-height:1.3\">{{ lv.k }}<\u002Fdiv>\n            <div style=\"font-family:'Roboto Mono SS',ui-monospace,Menlo,monospace;font-size:10px;color:#4c5156\">TARGET {{ lv.t }}%<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <sc-for list=\"{{ matrix }}\" as=\"r\" hint-placeholder-count=\"6\">\n        <div style=\"display:grid;grid-template-columns:216px repeat(6,minmax(64px,1fr));gap:0 18px;padding:14px 0 11px;border-bottom:1px solid #e1e7eb\">\n          <div style=\"display:flex;flex-direction:column;justify-content:center;padding-right:16px\">\n            <div style=\"text-transform:uppercase;font-size:13px;letter-spacing:.04em;color:#26292b\">{{ r.name }}<\u002Fdiv>\n            <div style=\"font-family:'Roboto Mono SS',ui-monospace,Menlo,monospace;text-transform:uppercase;font-size:9.5px;color:#4c5156;margin-top:5px\">{{ r.measured }}/6 levels measured<\u002Fdiv>\n          <\u002Fdiv>\n          <sc-for list=\"{{ r.cells }}\" as=\"c\" hint-placeholder-count=\"6\">\n            <div title=\"{{ c.title }}\" style=\"cursor:default\">\n              <div style=\"display:flex;align-items:baseline;gap:3px\">\n                <span style=\"font-family:'Roboto Mono SS',ui-monospace,Menlo,monospace;font-size:24px;font-weight:300;line-height:1;letter-spacing:-.02em;color:{{ c.fg }}\">{{ c.label }}<\u002Fspan>\n                <span style=\"font-family:'Roboto Mono SS',ui-monospace,Menlo,monospace;font-size:10px;color:#4c5156\">{{ c.unit }}<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"height:3px;margin-top:9px;background:#eef2f4;position:relative\">\n                <span style=\"position:absolute;left:0;top:0;bottom:0;width:{{ c.flagW }};min-width:{{ c.flagMin }};background:{{ c.flag }}\"><\u002Fspan>\n                <span style=\"position:absolute;left:{{ c.targetX }};top:-4px;bottom:-4px;width:1px;background:#26292b\"><\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n\n      <div style=\"position:sticky;bottom:0;background:#fff;display:grid;grid-template-columns:216px repeat(6,minmax(64px,1fr));gap:0 18px;padding-top:12px;border-top:2px solid #26292b\">\n        <div style=\"font-family:'Roboto Mono SS',ui-monospace,Menlo,monospace;text-transform:uppercase;font-size:10.5px;color:#4c5156;display:flex;align-items:center;padding-right:16px\">Level average<\u002Fdiv>\n        <sc-for list=\"{{ levelAvg }}\" as=\"a\" hint-placeholder-count=\"6\">\n          <div style=\"padding:0 0 6px\">\n            <div style=\"font-family:'Roboto Mono SS',ui-monospace,Menlo,monospace;font-size:16px;font-weight:300;color:{{ a.fg }}\">{{ a.label }}<\u002Fdiv>\n            <div style=\"font-family:'Roboto Mono SS',ui-monospace,Menlo,monospace;text-transform:uppercase;font-size:9.5px;color:#4c5156;margin-top:2px\">{{ a.note }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isQueue }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"background:#26292b;border-radius:12px;padding:32px 34px 28px;max-width:860px\">\n    <div style=\"margin-bottom:24px\">\n      <div style=\"font-family:'Roboto Mono SS',ui-monospace,Menlo,monospace;text-transform:uppercase;letter-spacing:.04em;font-size:11px;color:#d1dae2;margin-bottom:6px\">Test pyramid · one app, all six levels<\u002Fdiv>\n      <h2 style=\"font-family:var(--font-text);font-weight:400;text-transform:uppercase;letter-spacing:.02em;font-size:24px;line-height:.9;margin:0 0 10px;color:#fff\">Level By Level, Base To Tip<\u002Fh2>\n      <p style=\"font-size:13px;line-height:1.3;color:#d1dae2;margin:0;max-width:60ch\">All six levels are shown in pyramid order, with the tip on top. The blue bar shows how much is covered. The white line shows the target. The orange lines show what is still missing.<\u002Fp>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;gap:22px;align-items:flex-end;flex-wrap:wrap;padding-bottom:20px;margin-bottom:18px;border-bottom:1px solid #4c5156\">\n      <div style=\"flex:0 1 300px;min-width:210px\">\n        <div style=\"font-family:'Roboto Mono SS',ui-monospace,Menlo,monospace;text-transform:uppercase;letter-spacing:.04em;font-size:9.5px;color:#d1dae2;margin-bottom:6px\">Application<\u002Fdiv>\n        <sc-raw-select sc-camel-on-change=\"{{ pickScope }}\" value=\"{{ scopeValue }}\" style=\"width:100%;appearance:none;border:1px solid #5a6165;background-color:#1c1f21;background-image:linear-gradient(45deg,transparent 50%,#d1dae2 50%),linear-gradient(135deg,#d1dae2 50%,transparent 50%);background-position:calc(100% - 20px) 55%,calc(100% - 14px) 55%;background-size:6px 6px,6px 6px;background-repeat:no-repeat;color:#fff;font-family:'Replica LL TT',Arial,sans-serif;text-transform:uppercase;letter-spacing:.05em;font-size:12px;line-height:1;padding:12px 40px 12px 14px;border-radius:8px;cursor:pointer;transition:border-color .22s cubic-bezier(.2,0,0,1)\" style-hover=\"border-color:#d1dae2\" style-focus=\"outline:2px solid #459fdd;outline-offset:2px\">\n          <sc-for list=\"{{ scopeOptions }}\" as=\"o\" hint-placeholder-count=\"12\">\n            <option value=\"{{ o.v }}\">{{ o.label }}<\u002Foption>\n          <\u002Fsc-for>\n        <\u002Fsc-raw-select>\n      <\u002Fdiv>\n      <div style=\"font-family:'Roboto Mono SS',ui-monospace,Menlo,monospace;text-transform:uppercase;font-size:10px;color:#d1dae2;line-height:1.5;padding-bottom:4px\">{{ scopeSummary }}<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;flex-direction:column;gap:10px\">\n      <sc-for list=\"{{ pyramid }}\" as=\"b\" hint-placeholder-count=\"6\">\n        <div style=\"display:grid;grid-template-columns:150px 1fr 62px 190px;gap:18px;align-items:center\">\n          <div>\n            <div style=\"text-transform:uppercase;font-size:12px;letter-spacing:.03em;color:#fff\">{{ b.level }}<\u002Fdiv>\n            <div style=\"font-family:'Roboto Mono SS',ui-monospace,Menlo,monospace;font-size:9.5px;color:#d1dae2;margin-top:3px\">TARGET {{ b.target }}%<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;justify-content:center\">\n            <div style=\"width:{{ b.bandW }};position:relative;height:38px;background:#1c1f21;border-radius:8px;overflow:hidden;display:flex;align-items:center\">\n              <span style=\"position:absolute;left:0;top:0;bottom:0;width:{{ b.fillW }};background:{{ b.fill }}\"><\u002Fspan>\n              <span style=\"position:absolute;left:{{ b.overX }};top:0;bottom:0;width:{{ b.overW }};background:#0a7a44\"><\u002Fspan>\n              <span style=\"position:absolute;left:{{ b.gapX }};top:0;bottom:0;width:{{ b.gapW }};background:repeating-linear-gradient(45deg,#f36949 0 2px,transparent 2px 5px)\"><\u002Fspan>\n              <span style=\"position:absolute;left:{{ b.targetX }};top:0;bottom:0;width:2px;background:#fff\"><\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font-family:'Roboto Mono SS',ui-monospace,Menlo,monospace;font-size:15px;font-weight:300;text-align:right;color:{{ b.valueFg }}\">{{ b.value }}<\u002Fdiv>\n          <div>\n            <div style=\"font-family:'Roboto Mono SS',ui-monospace,Menlo,monospace;font-size:10px;color:{{ b.statusFg }};text-transform:uppercase\">{{ b.status }}<\u002Fdiv>\n            <div style=\"font-family:'Roboto Mono SS',ui-monospace,Menlo,monospace;font-size:9.5px;color:#d1dae2;margin-top:3px;overflow-wrap:anywhere\">{{ b.detail }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <div style=\"font-family:'Roboto Mono SS',ui-monospace,Menlo,monospace;text-transform:uppercase;font-size:9.5px;color:#d1dae2;margin-top:20px;padding-top:14px;border-top:1px solid #4c5156;line-height:1.5\">Bars get narrower toward the tip · white line = target · orange lines = missing coverage · green = above target<\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;defaultView&quot;:{&quot;editor    /* Sonar unit-layer repos with no measured levels above unit. */\n    const extra = [\n      { name: 'Opposition', loc: 56818, v: [75.1, 79.7, null, null, null, null], r: ['aowf-opposition-process', 'aowf-opposition-process-mf-ui'], d: ['41.6k lines of code', '15.2k lines of code'] },\n      { name: 'File Allocation', loc: 52655, v: [83.3, 70.4, null, null, null, null], r: ['dfa-file-allocation-process', 'dfa-file-allocation-mfe-ui'], d: ['33.0k lines of code', '19.7k lines of code'] },\n      { name: 'BRE', loc: 7235, v: [82.8, null, null, null, null, null], r: ['bre'], d: ['7.2k lines of code'] },\n      { name: 'Workload Table', loc: 6915, v: [null, 77.6, null, null, null, null], r: ['—', 'workload-table-mfe-ui'], d: [null, '6.9k lines of code'] },\n      { name: 'Booking Tool', loc: 4740, v: [null, 93.9, null, null, null, null], r: ['—', 'opst-booking-tool-front'], d: [null, '4.7k lines of code'] },\n      { name: 'Help', loc: 3500, v: [null, 86.5, null, null, null, null], r: ['—', 'pwb-help-mfe-ui'], d: [null, '3.5k lines of code'] },\n      { name: 'Registration Panel', loc: 3292, v: [null, 79.6, null, null, null, null], r: ['—', 'aewf-registration-panel-front'], d: [null, '3.3k lines of code'] }\n    ];\n    extra.forEach(a => { a.core = false; });\n    const lv = [\n      { k: 'Unit BE', t: 80 }, { k: 'Unit FE', t: 80 }, { k: 'Component (aka MFE)', t: 70 },\n      { k: 'Integration', t: 60 }, { k: 'E2E TA', t: 55 }, { k: 'E2E QC', t: 50 }\n    ];\n    return { core, extra, lv };\n  }\n\n  fmt(v) { return v === null ? 'n/a' : (Math.round(v * 10) / 10).toFixed(1); }\n\n  /* One UTC instant, shown in the reader's own time zone plus the UTC original. */\n  stamp() {\n    if (!this._stamp) {\n      const d = new Date();\n      const date = d.toLocaleDateString(undefined, { day: '2-digit', month: 'short', year: 'numeric' });\n      const time = d.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });\n      const zone = new Intl.DateTimeFormat(undefined, { timeZoneName: 'short' })\n        .formatToParts(d).find(p => p.type === 'timeZoneName');\n      const u = d.toISOString();\n      this._stamp = {\n        local: date + ', ' + time + (zone ? ' ' + zone.value : ''),\n        utc: u.slice(11, 16) + ' UTC · ' + u.slice(0, 10)\n      };\n    }\n    return this._stamp;\n  }\n\n  renderVals() {\n    const { core, extra, lv } = this.data();\n    const all = true;\n    const view = this.state.view ?? (this.props.defaultView === 'Test pyramid' ? 'queue' : 'matrix');\n    const apps = all ? core.concat(extra) : core;\n\n    const matrix = apps.map(w => {\n      const got = w.v.filter(v => v !== null);\n      return {\n      measured: got.length,\n      name: w.name,\n      cells: w.v.map((v, ci) => {\n        const na = v === null, below = !na && v < lv[ci].t;\n        const repo = (w.r && w.r[ci] && w.r[ci] !== '—') ? w.r[ci] : null;\n        return {\n          label: na ? '—' : this.fmt(v),\n          unit: na ? '' : '%',\n          fg: na ? '#4c5156' : '#26292b',\n          flag: na ? 'transparent' : (below ? '#f36949' : '#1485c3'),\n          flagW: na ? '0%' : Math.min(100, v).toFixed(1) + '%',\n          flagMin: na ? '0' : '2px',\n          targetX: 'calc(' + lv[ci].t + '% - 1px)',\n          title: w.name + ' · ' + lv[ci].k + '\\n' + (na\n            ? (w.core ? 'No measurement at this level' : 'Measured at unit level only')\n            : this.fmt(v) + '% vs target ' + lv[ci].t + '%')\n            + (repo ? '\\nRepo: ' + repo : '')\n            + ((w.d && w.d[ci]) ? '\\nMeasured on: ' + w.d[ci] : '')\n        };\n      })\n    };\n    });\n\n    const levelAvg = lv.map((l, ci) => {\n      const vals = apps.map(w => w.v[ci]).filter(v => v !== null);\n      if (!vals.length) return { label: '—', fg: '#bdcbd7', note: 'no data' };\n      const avg = vals.reduce((a, b) => a + b, 0) / vals.length, d = avg - l.t;\n      return { label: this.fmt(avg), fg: d < 0 ? '#d11f1f' : '#0a7a44', note: this.fmt(Math.abs(d)) + '% ' + (d < 0 ? 'below' : 'above') + ' target' };\n    });\n\n    const rows = [];\n    apps.forEach(w => w.v.forEach((v, ci) => {\n      if (v === null) return;\n      const gap = lv[ci].t - v;\n      if (gap <= 0) return;\n      rows.push({ w, ci, v, gap, score: gap * Math.sqrt(w.loc) });\n    }));\n    rows.sort((a, b) => b.score - a.score);\n\n    const scopeIdx = Math.min(this.state.qApp ?? 0, apps.length - 1);\n    const app = apps[scopeIdx];\n    const scopeOptions = apps.map((o, i) => ({ v: String(i), label: o.name }));\n    const appGaps = rows.filter(r => r.w === app);\n    const measured = app.v.filter(v => v !== null).length;\n    const scopeSummary = measured + ' of 6 levels measured · ' + (app.loc / 1000).toFixed(1) + 'k lines of code · '\n      + (appGaps.length === 1 ? '1 level below target' : appGaps.length + ' levels below target');\n\n    /* Tip first: E2E QC → Unit BE, band width narrows toward the tip. */\n    const pyramid = lv.map((l, ci) => l).reverse().map((l, ri) => {\n      const ci = lv.length - 1 - ri;\n      const v = app.v[ci], na = v === null, gap = na ? 0 : Math.max(0, l.t - v);\n      const repo = (app.r && app.r[ci] && app.r[ci] !== '—') ? app.r[ci] : null;\n      return {\n        level: l.k, target: l.t,\n        bandW: (46 + ri * 10.8).toFixed(1) + '%',\n        fillW: na ? '0%' : Math.round(Math.min(v, l.t)) + '%',\n        overX: 'calc(' + l.t + '%)',\n        overW: na ? '0%' : Math.round(Math.max(0, v - l.t)) + '%',\n        gapX: na ? '0%' : Math.round(Math.min(v, l.t)) + '%',\n        gapW: Math.round(gap) + '%',\n        fill: na ? 'transparent' : '#459fdd',\n        targetX: 'calc(' + l.t + '% - 1px)',\n        value: na ? 'n/a' : this.fmt(v) + '%',\n        valueFg: na ? '#97a2ac' : '#ffffff',\n        status: na ? 'not measured yet' : (gap > 0 ? this.fmt(gap) + '% below target' : 'target reached'),\n        statusFg: na ? '#97a2ac' : (gap > 0 ? '#fe8d6b' : '#8fd6b0'),\n        detail: (repo ? repo : 'no tests set up here') + ((app.d && app.d[ci]) ? ' · ' + app.d[ci] : '')\n      };\n    });\n\n    const locTotal = (apps.reduce((a, w) => a + w.loc, 0) / 1000).toFixed(0) + 'k';\n    const isMatrix = view === 'matrix';\n\n    return {\n      levels: lv, matrix, levelAvg, pyramid,\n      isMatrix, isQueue: !isMatrix,\n      appCount: apps.length,\n      locTotal,\n      generatedLocal: this.stamp().local,\n      generatedUtc: this.stamp().utc,\n      scopeOptions, scopeSummary,\n      scopeValue: String(scopeIdx),\n      pickScope: e => this.setState({ qApp: parseInt(e.target.value, 10) }),\n      tabMatrixBg: isMatrix ? '#26292b' : 'transparent',\n      tabMatrixFg: isMatrix ? '#ffffff' : '#4c5156',\n      tabMatrixHover: isMatrix ? '#26292b' : '#eef2f4',\n      tabQueueBg: isMatrix ? 'transparent' : '#26292b',\n      tabQueueFg: isMatrix ? '#4c5156' : '#ffffff',\n      tabQueueHover: isMatrix ? '#eef2f4' : '#26292b',\n      showMatrix: () => this.setState({ view: 'matrix' }),\n      showQueue: () => this.setState({ view: 'queue' }),\n      showQueueNoop: null\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
