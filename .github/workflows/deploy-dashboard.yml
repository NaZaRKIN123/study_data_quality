name: Deploy dashboard to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'pages/dashboard.html'
      - '.github/workflows/deploy-dashboard.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two Pages deployments at once; skip queued runs but let the
# in-progress one finish so a deployment is not left half-done.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble site
        run: |
          mkdir -p _site
          # Served at the site root, so https://<user>.github.io/<repo>/ works.
          cp pages/dashboard.html _site/index.html
          # Keep the original name reachable too.
          cp pages/dashboard.html _site/dashboard.html
          # Stop Jekyll from touching the output (files/dirs starting with _).
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
